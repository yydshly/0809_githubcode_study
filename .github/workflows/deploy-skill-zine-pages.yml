name: Deploy Skill Zine public guide

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-skill-zine-pages.yml"
      - "projects/skill-zine-summary/public-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload public-safe site
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/skill-zine-summary/public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
