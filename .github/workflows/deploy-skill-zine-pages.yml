name: Deploy full Skill Zine research site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-skill-zine-pages.yml"
      - "projects/skill-zine-summary/public-site/**"
      - "projects/skill-zine-summary/lab/web/app/**"
      - "projects/skill-zine-summary/lab/web/build/**"
      - "projects/skill-zine-summary/lab/web/scripts/export-github-pages.mjs"
      - "projects/skill-zine-summary/lab/web/package.json"
      - "projects/skill-zine-summary/lab/web/package-lock.json"
      - "projects/skill-zine-summary/lab/web/vite.config.ts"
      - "projects/visual-route-studio/README.md"
      - "projects/visual-route-studio/ARCHIVE.md"
      - "projects/visual-route-studio/compositor/**"
      - "projects/visual-route-studio/target-studio/**"
      - "projects/visual-route-studio/samples/**"
      - "projects/id-photo-workflow-lab/public-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/skill-zine-summary/lab/web/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: projects/skill-zine-summary/lab/web

      - name: Build research website
        run: npm run build
        working-directory: projects/skill-zine-summary/lab/web
        env:
          NEXT_PUBLIC_SITE_URL: https://yydshly.github.io/0809_githubcode_study

      - name: Export GitHub Pages snapshot
        run: npm run export:github-pages
        working-directory: projects/skill-zine-summary/lab/web

      - name: Verify exported routes and links
        run: npm run verify:github-pages
        working-directory: projects/skill-zine-summary/lab/web

      - name: Add Image Product Studio archive
        shell: bash
        run: |
          target="projects/skill-zine-summary/lab/web/github-pages-dist/visual-route-studio"
          mkdir -p "$target"
          cp projects/visual-route-studio/README.md "$target/README.md"
          cp projects/visual-route-studio/ARCHIVE.md "$target/ARCHIVE.md"
          cp -R projects/visual-route-studio/compositor "$target/compositor"
          cp -R projects/visual-route-studio/target-studio "$target/target-studio"
          cp -R projects/visual-route-studio/samples "$target/samples"
          rm -f "$target/compositor/server.mjs"

      - name: Verify Image Product Studio archive
        shell: bash
        run: |
          target="projects/skill-zine-summary/lab/web/github-pages-dist/visual-route-studio"
          test -f "$target/compositor/index.html"
          test -f "$target/ARCHIVE.md"
          test -f "$target/compositor/app.js"
          test -f "$target/compositor/styles.css"
          test -f "$target/target-studio/assets/repair-memory-reconstruction-result.png"
          test -f "$target/samples/rainy-bookstore/source-contact-sheet.png"
          node --check "$target/compositor/app.js"

      - name: Add ID Photo Workflow static research demo
        shell: bash
        run: |
          target="projects/skill-zine-summary/lab/web/github-pages-dist/id-photo-workflow-lab"
          mkdir -p "$target"
          cp -R projects/id-photo-workflow-lab/public-site/. "$target"

      - name: Verify ID Photo Workflow static demo
        shell: bash
        run: |
          target="projects/skill-zine-summary/lab/web/github-pages-dist/id-photo-workflow-lab"
          test -f "$target/index.html"
          test -f "$target/styles.css"
          test -f "$target/showcase.js"
          test -f "$target/assets/source-fictional-mannequin-preview.webp"
          test -f "$target/assets/result-transparent.png"
          test -f "$target/assets/layout-a4.png"
          node --check "$target/showcase.js"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload complete static research site
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/skill-zine-summary/lab/web/github-pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
