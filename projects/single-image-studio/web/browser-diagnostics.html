<!doctype html>
<html lang="zh-CN" data-diagnostic-state="pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Single Image Studio · 浏览器输出诊断</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182019; background: #f4f3ed; }
      body { max-width: 52rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
      h1 { font-size: clamp(1.6rem, 5vw, 2.5rem); }
      p { line-height: 1.65; }
      button { min-height: 2.75rem; border: 0; border-radius: .7rem; padding: .7rem 1rem; background: #245c43; color: white; font-weight: 700; cursor: pointer; }
      #diagnostic-status { display: block; margin: 1rem 0; padding: 1rem; border-radius: .7rem; background: white; }
      table { width: 100%; border-collapse: collapse; background: white; }
      th, td { padding: .7rem; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .78rem; }
      [data-result="pass"] { color: #17633c; font-weight: 800; }
      [data-result="fail"] { color: #9d251d; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <p>内部 QA · 不读取用户图片、不访问网络</p>
      <h1>浏览器输出诊断</h1>
      <p>用项目内存生成的像素检查 Canvas 编码、metadata 清理、重开像素、蒙版修正后的透明 PNG / 纯色 JPEG、16:9 / 9:16 场景模板真实输出，以及失败恢复按钮的主次、文案与焦点。通过只代表当前浏览器会话，不代表所有设备。</p>
      <button id="run-diagnostics" type="button">重新运行诊断</button>
      <output id="diagnostic-status" role="status">尚未运行</output>
      <table>
        <thead><tr><th>检查</th><th>结果</th><th>详情</th></tr></thead>
        <tbody id="diagnostic-results"></tbody>
      </table>
      <h2>环境</h2>
      <pre id="diagnostic-environment"></pre>
    </main>
    <script type="module" src="./browser-diagnostics.js"></script>
  </body>
</html>
